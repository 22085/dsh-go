name: Build APK (arm64)

# Personal build workflow for a fork of dsh-Go: builds the arm64 runtime
# dsh 0.2.2-rc.1: the runtime step runs with DSH_VERSION=0.2.2-rc.1
# (adapted patches + pins + lock are committed in runtime/).
# and the release arm64 APK, then uploads the APK as a workflow artifact.
# Upstream CI only runs tests, so this workflow is added on the fork only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install zstd
        run: sudo apt-get update -q && sudo apt-get install -yq zstd
      - name: Bump proot pin
        # Termux's index no longer carries proot 5.1.107.98; 5.1.107.102 is
        # the current aarch64 build. Only the PROOT_VERSION line may change:
        # the PIN table entries for 5.1.107.98 must stay untouched, or the
        # old .98 hash would be checked against the new .102 deb.
        run: sed -i 's/^PROOT_VERSION="5.1.107.98"/PROOT_VERSION="5.1.107.102"/' runtime/build-runtime.sh
      - name: Set up toolchain
        run: |
          bash tooling/setup-toolchain.sh
          source tooling/env.sh
          {
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "PUB_HOSTED_URL=$PUB_HOSTED_URL"
            echo "FLUTTER_STORAGE_BASE_URL=$FLUTTER_STORAGE_BASE_URL"
          } >> "$GITHUB_ENV"
          {
            echo "$JAVA_HOME/bin"
            echo "$HOME/dev/flutter/bin"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"
      - name: Build runtime
        # The runtime script downloads many Ubuntu debs from a mirror that
        # sometimes refuses a connection from a GitHub runner (curl exit 7).
        # Retry the runtime build a few times inside this step so one
        # refused download does not kill the whole run.
        run: |
          for attempt in 1 2 3; do
            if DSH_VERSION=0.2.2-rc.1 bash runtime/build-runtime.sh arm64-v8a; then
              break
            fi
            echo "runtime build attempt $attempt failed, retrying in 30s"
            sleep 30
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
          done
      - name: Set up release signing
        # The app's build.gradle.kts already signs release with key.properties
        # when it exists, and falls back to debug without it. The keystore and
        # passwords live only in this repo's Actions secrets, never in the repo.
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release.keystore
          cat > app/android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=dshgo
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build APK
        run: DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 7
